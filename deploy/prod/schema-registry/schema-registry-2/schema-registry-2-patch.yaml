---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: schema-registry
  labels:
    app: schema-registry-2
spec:
  replicas: 1
  serviceName: schema-registry-2
  selector:
    matchLabels:
        app: schema-registry-2
  template:
    metadata:
      labels:
        app: schema-registry-2
    spec:
      containers:
        - name: schema-registry
          env:
          - name: SCHEMA_REGISTRY_HOST_NAME
            value: "schema-registry-2"
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels:
    app: schema-registry-2
spec:
  selector:
    app: schema-registry-2
