---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  labels:
    app: kafka-controller-1
  name: kafka-controller-1-claim0
spec:
  storageClassName: ""
  volumeName: fdk-prod-kafka-controller-1
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 9G
---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: fdk-prod-kafka-controller-1
spec:
  storageClassName: ""
  capacity:
    storage: 9G
  accessModes:
    - ReadWriteOnce
  gcePersistentDisk:
    pdName: fdk-prod-kafka-controller-1
    fsType: ext4
