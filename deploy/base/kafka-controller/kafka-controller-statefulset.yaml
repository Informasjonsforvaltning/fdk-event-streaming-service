apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-controller
  serviceName: kafka-controller
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kafka-controller
          imagePullPolicy: Always
          image: confluentinc/cp-kafka:8.3.2
          # The cp-kafka image ships KAFKA_ADVERTISED_LISTENERS="" as a built-in
          # env var. 7.9.x unsets it for controller-only nodes, 8.x does not and
          # then renders an empty advertised.listeners that Kafka 4.x rejects.
          # Unsetting it here keeps the step 4 image bump a pure tag change.
          command:
            - /bin/bash
            - -c
            - unset KAFKA_ADVERTISED_LISTENERS; exec /etc/confluent/docker/run
          env:
            - name: KAFKA_PROCESS_ROLES
              value: "controller"
            - name: KAFKA_LISTENERS
              value: "CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:SASL_PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: "SCRAM-SHA-512"
            - name: KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL
              value: "SCRAM-SHA-512"
            - name: SCRAM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-scram-users
                  key: admin
            - name: KAFKA_LISTENER_NAME_CONTROLLER_SCRAM___SHA___512_SASL_JAAS_CONFIG
              value: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="$(SCRAM_ADMIN_PASSWORD)";'
            # Must match the brokers; ACLs live in the KRaft metadata log.
            - name: KAFKA_AUTHORIZER_CLASS_NAME
              value: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
            - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
              value: "true"
            - name: KAFKA_SUPER_USERS
              value: "User:admin"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512M -Xmx512M"
            - name: KAFKA_LOG4J_ROOT_LOGLEVEL
              value: "WARN"
          ports:
            - containerPort: 9093
          resources:
            requests:
              memory: 768Mi
              cpu: 100m
            limits:
              memory: 768Mi
