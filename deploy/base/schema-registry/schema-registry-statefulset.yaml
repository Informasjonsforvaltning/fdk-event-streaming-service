apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: schema-registry
spec:
  replicas: 1
  serviceName: schema-registry
  selector:
    matchLabels:
      app: schema-registry
  template:
    spec:
      containers:
        - name: schema-registry
          env:
          - name: SCHEMA_REGISTRY_LISTENERS
            value: "http://0.0.0.0:8081"
          # Kafka connection comes from the per-client secret delivered by fdk-infra.
          - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
            valueFrom:
              secretKeyRef:
                name: kafka-user-schema-registry
                key: BROKERS
          - name: SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL
            valueFrom:
              secretKeyRef:
                name: kafka-user-schema-registry
                key: SECURITY_PROTOCOL
          - name: SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM
            valueFrom:
              secretKeyRef:
                name: kafka-user-schema-registry
                key: SASL_MECHANISM
          - name: SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG
            valueFrom:
              secretKeyRef:
                name: kafka-user-schema-registry
                key: SASL_JAAS_CONFIG
          image: confluentinc/cp-schema-registry:8.3.2
          imagePullPolicy: Always
          ports:
            - containerPort: 2181
          resources:
            requests:
              memory: 100Mi
